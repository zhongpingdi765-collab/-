<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文書検索</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4dccb;
      --paper: #f7f3ea;
      --card: #fffdf8;
      --accent: #9a3412;
      --mark: #f3d27a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.75;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    form { display: flex; gap: 8px; margin-top: 28px; }
    input[type="search"] {
      flex: 1;
      border: 1px solid #c9bfae;
      background: var(--card);
      color: var(--ink);
      border-radius: 4px;
      padding: 12px 14px;
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button, .chip {
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    button[type="submit"] {
      background: var(--accent);
      color: #fffaf3;
      border-radius: 4px;
      padding: 0 18px;
    }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chip {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
    }
    .chip:hover { color: var(--ink); border-color: #b7ad9c; }
    .meta { color: var(--muted); font-size: 14px; min-height: 1.5em; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px 18px;
      margin-top: 12px;
    }
    .rank {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    h2 { margin: 2px 0 8px; font-size: 20px; font-family: "Yu Mincho", serif; font-weight: 600; }
    mark { background: var(--mark); color: inherit; padding: 0 0.12em; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
    th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    details.body { margin-top: 8px; }
    details.body p { margin: 8px 0 0; white-space: pre-wrap; }
    .empty { color: var(--muted); }
    footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    @media (max-width: 640px) {
      h1 { font-size: 32px; }
      form { flex-direction: column; }
      button[type="submit"] { height: 44px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>文書検索</h1>

    <form id="form">
      <label class="sr-only" for="q">検索語</label>
      <input id="q" type="search" name="q" placeholder="例: 台風の被害" autocomplete="off" autofocus>
      <button type="submit">検索</button>
    </form>
    <div class="examples" id="examples">
      <button class="chip" type="button" data-q="台風の被害">台風の被害</button>
      <button class="chip" type="button" data-q="半導体工場">半導体工場</button>
      <button class="chip" type="button" data-q="走った選手">走った選手</button>
      <button class="chip" type="button" data-q="発酵食品">発酵食品</button>
      <button class="chip" type="button" data-q="海氷">海氷</button>
      <button class="chip" type="button" data-q="浮世絵">浮世絵</button>
      <button class="chip" type="button" data-q="熱中症">熱中症</button>
      <button class="chip" type="button" data-q="古典籍">古典籍</button>
    </div>

    <p class="meta" id="meta"></p>
    <div id="results"></div>

    <footer>
      <p id="footer">索引を読み込んでいます。</p>
      <details>
        <summary>検索対象の文章</summary>
        <ul id="doclist"></ul>
      </details>
    </footer>
  </div>
  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const meta = document.getElementById("meta");
    const results = document.getElementById("results");

    async function search(query) {
      const q = query.trim();
      if (!q) {
        meta.textContent = "言葉を入力してください。";
        return;
      }
      input.value = q;
      history.replaceState(null, "", "/?q=" + encodeURIComponent(q));
      meta.textContent = "検索しています…";
      try {
        const response = await fetch("/api/search?q=" + encodeURIComponent(q) + "&k=8");
        if (!response.ok) throw new Error("search failed");
        const data = await response.json();
        render(data);
      } catch (error) {
        meta.textContent = "検索に失敗しました。";
      }
    }

    function render(data) {
      results.replaceChildren();
      if (!data.terms.length) {
        meta.textContent = "検索に使える語がありません。名詞や動詞を含めてください。";
        return;
      }
      const dropped = data.dropped.length ? "　除外: " + data.dropped.join("、") : "";
      meta.textContent = "検索語: " + data.terms.join("、") + dropped + "　" + data.elapsed_ms + " ms";
      if (!data.results.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "一致する文章はありません。";
        results.appendChild(p);
        return;
      }
      data.results.forEach((item, index) => {
        const article = document.createElement("article");
        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = (index + 1) + "位　スコア " + item.score.toFixed(3);
        const title = document.createElement("h2");
        title.textContent = item.title;
        const snippet = document.createElement("p");
        snippet.innerHTML = item.snippet_html;
        article.append(rank, title, snippet);

        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "スコア";
        const table = document.createElement("table");
        const head = document.createElement("tr");
        ["語", "文書内の回数", "出現文書数", "IDF", "寄与"].forEach((label, i) => {
          const th = document.createElement("th");
          th.textContent = label;
          if (i > 0) th.className = "num";
          head.appendChild(th);
        });
        table.appendChild(head);
        item.contributions.forEach((row) => {
          const tr = document.createElement("tr");
          [row.term, row.tf, row.df, row.idf.toFixed(3), row.score.toFixed(3)].forEach((value, i) => {
            const td = document.createElement("td");
            td.textContent = value;
            if (i > 0) td.className = "num";
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        details.append(summary, table);
        article.appendChild(details);

        const body = document.createElement("details");
        body.className = "body";
        const bodySummary = document.createElement("summary");
        bodySummary.textContent = "本文";
        const bodyText = document.createElement("p");
        bodyText.textContent = item.body;
        body.append(bodySummary, bodyText);
        article.appendChild(body);
        results.appendChild(article);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      search(input.value);
    });
    document.getElementById("examples").addEventListener("click", (event) => {
      const button = event.target.closest("[data-q]");
      if (button) search(button.dataset.q);
    });

    fetch("/api/stats").then((response) => response.json()).then((stats) => {
      document.getElementById("footer").textContent =
        "文書 " + stats.n_docs + " 件、語彙 " + stats.vocabulary + " 語、平均の長さ " + stats.avgdl + " 語。";
      const list = document.getElementById("doclist");
      stats.documents.forEach((doc) => {
        const li = document.createElement("li");
        li.textContent = doc.title;
        list.appendChild(li);
      });
    });

    const initial = new URLSearchParams(location.search).get("q");
    if (initial) search(initial);
  </script>
</body>
</html>
